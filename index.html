  const catTitle = h("div", {class:"section-title-tag"}, h("span", {class:"num-badge"}, "1"), " Choose Service Category");
  const catNav = h("div", {class:"category-navigation"}, ...CATEGORY_ORDER.map(k =>
    h("button", {class:"nav-tab-btn" + (state.cat===k?" active":""), type:"button", onclick:()=>{ state.cat=k; state.selected=null; state.showTerminal=false; state.profile=null; state.profileError=""; state.profileConfirmed=false; state.post=null; state.postError=""; state.postConfirmed=false; render(); scheduleLookup(); }}, CATEGORY_META[k].navLabel)
  ));

  const grid = h("div", {class:"services-grid-wrapper"}, ...services.map((it, idx) => {
    const [title, sub, price, tag, save] = it;
    const sel = state.selected && state.selected.idx === idx;
    return h("div", {class:"service-card"+(sel?" selected":""), onclick:()=>{
      state.selected = {idx, title, price}; state.showTerminal=false; render();
      requestAnimationFrame(()=>{ document.getElementById("details-section")?.scrollIntoView({behavior:"smooth"}); setTimeout(()=>document.getElementById("u-mobile")?.focus(),400); });
    }},
      h("div", {class:"service-info"},
        h("h4", null, title, tag?h("span",{class:"tag-popular"},tag):null),
        h("p", null, sub)),
      h("div", {class:"rate-container"},
        h("span", {class:"service-rate"}, inr(price)),
        save?h("span",{class:"tag-save"},save):null)
    );
  }));

  const details = h("div", {class:"input-fields-container", id:"details-section"});
  details.appendChild(h("div",{class:"section-title-tag"}, h("span",{class:"num-badge"},"2"), " Fill Target Details"));
  const g1 = h("div",{class:"form-group"},
    h("label",{class:"form-label", for:"u-mobile"}, "📞 WhatsApp Mobile Number"),
    h("input",{id:"u-mobile", type:"tel", placeholder:"Enter 10-digit number", value: state.mobile, oninput:e=>{ state.mobile=e.target.value; }})
  );
  const targetInput = h("input",{id:"u-target", type:"text", placeholder:"Paste link or type handle username", autocomplete:"off", value:state.target,
    oninput:e=>{ state.target=e.target.value; state.showAuto=true; renderAuto(); scheduleLookup(); },
    onfocus:()=>{ state.showAuto=true; renderAuto(); },
    onblur:()=>setTimeout(()=>{ state.showAuto=false; renderAuto(); },200)
  });
  const autoWrap = h("div",{id:"auto-wrap"});
  const previewWrap = h("div",{id:"profile-preview"});
  const g2 = h("div",{class:"form-group", style:"position:relative"},
    h("label",{class:"form-label", for:"u-target"}, meta.fieldLabel),
    targetInput, autoWrap, previewWrap
  );
  details.appendChild(g1); details.appendChild(g2);

  function renderAuto() {
    autoWrap.innerHTML = "";
    if (!state.showAuto || !state.target) return;
    const matches = (AUTOCOMPLETE_DATA[state.cat]||[]).filter(i => i.toLowerCase().includes(state.target.toLowerCase()));
    if (!matches.length) return;
    const dd = h("div",{class:"autocomplete-dropdown"}, ...matches.map(item =>
      h("div",{class:"autocomplete-item", onmousedown:()=>{ state.target=item; state.showAuto=false; render(); scheduleLookup(); }}, item)
    ));
    autoWrap.appendChild(dd);
  }

  const inv = h("div",{class:"invoice-box"},
    h("div",{class:"invoice-row"},
      h("span",null,"Selected Item:"),
      h("span",{style:"color:#fff;font-weight:600"}, state.selected?`${state.selected.title} (${meta.category})`:"None")),
    h("div",{class:"invoice-total"},
      h("span",null,"Total Payable Amount:"),
      h("span",null, state.selected?inr(state.selected.price):"₹0"))
  );
  details.appendChild(inv);

  if (state.selected && !state.showTerminal) {
    const ready = needsPost(state.cat) ? state.postConfirmed : state.profileConfirmed;
    const label = ready ? "Pay & Place Order" : (needsPost(state.cat) ? "Pay & Place Order" : "Pay & Place Order");
    const btnPay = h("button",{type:"button", id:"pay-place-order", class:"btn-proceed-pay", onclick: ready ? proceed : null}, label);
    if (ready) { btnPay.style.background = "linear-gradient(135deg,#00e676,#00b248)"; btnPay.style.color = "#fff"; }
    else { btnPay.disabled = true; btnPay.style.background = "#9ca3af"; btnPay.style.color = "#f3f4f6"; btnPay.style.boxShadow = "none"; btnPay.style.cursor = "not-allowed"; }
    details.appendChild(btnPay);
    const strip = h("div"); strip.innerHTML = `<div class="upi-secure-line"><span>🔒</span><span>Secure UPI Payment</span></div>
      <div class="upi-app-strip">
        <span class="upi-app-tile" style="background:#ffffff"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Google_Pay_2018_icon.svg" alt="Google Pay" loading="lazy"></span>
        <span class="upi-app-tile" style="background:#5f259f"><img src="https://cdn.simpleicons.org/phonepe/ffffff" alt="PhonePe" loading="lazy"></span>
        <span class="upi-app-tile" style="background:#00baf2"><img src="https://cdn.simpleicons.org/paytm/ffffff" alt="Paytm" loading="lazy"></span>
        <span class="upi-app-tile" style="background:#ffffff"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/UPI-Logo-vector.svg" alt="UPI" loading="lazy"></span>
      </div>`;
    while (strip.firstChild) details.appendChild(strip.firstChild);
  }

  app.appendChild(trust); app.appendChild(headline); app.appendChild(steps);
  app.appendChild(catTitle); app.appendChild(catNav); app.appendChild(grid); app.appendChild(details);

  if (state.showTerminal && state.selected) {
    const s = state.selected;
    const upi = `upi://pay?pa=${encodeURIComponent(UPI_ID)}&pn=${encodeURIComponent(MERCHANT_NAME)}&am=${s.price}&cu=INR&tn=${encodeURIComponent(s.title)}`;
    const qr = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(upi)}`;
    const panel = h("div",{class:"payment-terminal-panel", id:"payment-terminal"});
    panel.innerHTML = `
      <div class="section-title-tag" style="justify-content:center;color:var(--gold);margin-bottom:15px">
        <span class="num-badge" style="background:black;color:var(--gold)">3</span> Scan &amp; Pay
      </div>
      <div style="text-align:center;background:#fff;padding:12px;border-radius:12px">
        <div style="font-size:12px;color:#333;font-weight:700;margin-bottom:6px">Scan to Pay</div>
        <img src="${qr}" alt="UPI QR" style="width:230px;height:230px;display:block;margin:0 auto"/>
      </div>
      <p style="font-size:13px;color:var(--text-dim);margin:10px 0 0">Open any UPI app (GPay / PhonePe / Paytm) &rarr; Scan this QR &rarr; pay ${inr(s.price)} and enter your UPI PIN.</p>
      <div class="upi-secure-line"><span>🔒</span><span>Secure UPI Payment</span></div>
      <div class="upi-app-strip">
        <span class="upi-app-tile" style="background:#ffffff"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Google_Pay_2018_icon.svg" alt="Google Pay" loading="lazy"></span>
        <span class="upi-app-tile" style="background:#5f259f"><img src="https://cdn.simpleicons.org/phonepe/ffffff" alt="PhonePe" loading="lazy"></span>
        <span class="upi-app-tile" style="background:#00baf2"><img src="https://cdn.simpleicons.org/paytm/ffffff" alt="Paytm" loading="lazy"></span>
        <span class="upi-app-tile" style="background:#ffffff"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/UPI-Logo-vector.svg" alt="UPI" loading="lazy"></span>
      </div>
      <p style="font-size:14px;margin-top:12px;font-weight:700;color:#00e676">Total Payable: <span>${inr(s.price)}</span></p>
    `;
    app.appendChild(panel);
  }

  const footBadges = h("div",{class:"badge-footer-grid"});
  footBadges.innerHTML = `
    <div class="footer-badge-item"><span style="font-size:16px">🛡️</span><span>100% Safe<br><span style="color:var(--text-dim)">No Password</span></span></div>
    <div class="footer-badge-item"><span style="font-size:16px">⚡</span><span>Instant Delivery<br><span style="color:var(--text-dim)">Automated System</span></span></div>
  `;
  app.appendChild(footBadges);

  app.appendChild(h("div",{class:"faq-title-banner"}, h("div",{class:"faq-head-section-title"}, "Frequently Asked Questions"), h("div",{class:"faq-head-section-subtitle"}, "Everything you need to know about our service")));
  const faqBox = h("div",{class:"faq-accordion-box"});
  FAQS.forEach(([q,a],i)=>{
    const open = state.openFaq === i;
    const row = h("div",{class:"faq-row-item"});
    row.appendChild(h("div",{class:"faq-header-trigger", onclick:()=>{ state.openFaq = open?null:i; render(); }}, h("span",null,q), h("span",null, open?"−":"+")));
    const body = h("div",{class:"faq-body-content" + (open?" open":"")}, h("p",null,a));
    row.appendChild(body);
    faqBox.appendChild(row);
  });
  app.appendChild(faqBox);
  renderProfile();

  app.appendChild(h("div",{class:"footer-section"}, "© growsocialmedia.in — All rights reserved."));
}

function proceed() {
  if (!state.mobile.trim() || !state.target.trim()) {
    alert("Please complete mobile number and target handle details fields.");
    return;
  }
  if (!state.selected) return;
  if (needsPost(state.cat) ? !state.postConfirmed : !state.profileConfirmed) return;
  state.showTerminal = true;
  render();
  requestAnimationFrame(()=>document.getElementById("payment-terminal")?.scrollIntoView({behavior:"smooth"}));
}

render();
renderProfile();
</script>
</body>
</html>
