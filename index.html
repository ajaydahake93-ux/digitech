let lookupTimer = null, lookupSeq = 0;
const LOOKUP_CACHE = new Map();
const POST_CACHE = new Map();

function platformOf(cat) { return cat.startsWith("fb-") ? "facebook" : "instagram"; }
function needsProfile(cat) { return cat === "fb-followers"; }
function needsPost(cat) { return cat.startsWith("ig-") || cat === "fb-post-indian" || cat === "fb-reels-short-views"; }

function unitOf(cat) {
  if (cat === "ig-views" || cat === "fb-reels-short-views") return "Views";
  if (cat === "ig-repost") return "Reposts";
  if (cat === "ig-save") return "Saves";

  if (cat === "ig-comments") return "Comments";
  return "Likes";
}

function scheduleLookup() {
  clearTimeout(lookupTimer);
  const raw = state.target.trim();
  state.profileConfirmed = false;
  if (needsPost(state.cat)) {
    state.postConfirmed = false; state.profile = null; state.profileError = "";
    if (cleanShortcode(raw).length < 1) {
      state.post = null; state.postError = ""; state.postLoading = false; renderProfile(); return;
    }
    const pkey = "post:" + cleanShortcode(raw);
    if (POST_CACHE.has(pkey)) {
      lookupSeq++; state.post = POST_CACHE.get(pkey); state.postError = ""; state.postLoading = false; renderProfile(); return;
    }
    state.postLoading = true; state.postError = ""; renderProfile();
    lookupTimer = setTimeout(() => doPostLookup(raw), 250);
    return;
  }
  state.post = null; state.postError = ""; state.postLoading = false; state.postConfirmed = false;
  if (!needsProfile(state.cat) || cleanHandle(raw).length < 2) {
    state.profile = null; state.profileError = ""; state.profileLoading = false;
    renderProfile();
    return;
  }
  const key = platformOf(state.cat) + ":" + cleanHandle(raw).toLowerCase();
  if (LOOKUP_CACHE.has(key)) {
    lookupSeq++;
    state.profile = LOOKUP_CACHE.get(key); state.profileError = ""; state.profileLoading = false;
    renderProfile();
    return;
  }
  state.profileLoading = true; state.profileError = ""; renderProfile();
  lookupTimer = setTimeout(() => doLookup(raw), 220);
}

function cleanHandle(raw) {
  let v = (raw || "").trim();
  if (!v) return "";
  if (v.indexOf("http") > -1 || v.indexOf("/") > -1) {
    const m = v.match(/(?:instagram|facebook)\.com\/([^/?#]+)/i);
    v = m ? m[1] : (v.split("/").filter(Boolean).pop() || v);
  }
  return v.replace(/^@/, "").split("?")[0].trim();
}

function proxyImage(url) {
  if (!url) return "";
  return "https://images.weserv.nl/?url=" + encodeURIComponent(url.replace(/^https?:\/\//, "")) + "&w=160&h=160&fit=cover&mask=circle";
}

async function viaProxy(username) {
  const target = "https://www.instagram.com/api/v1/users/web_profile_info/?username=" + encodeURIComponent(username);
  const proxies = [
    u => "https://corsproxy.io/?" + encodeURIComponent(u),
    u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
    u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u),
  ];
  for (const mk of proxies) {
    try {
      const r = await fetch(mk(target), { headers: { "x-ig-app-id": "936619743392459" } });
      if (!r.ok) continue;
      const j = await r.json();
      const u = j && j.data && j.data.user;
      if (!u) continue;
      return {
        found: true,
        username: u.username,
        fullName: u.full_name || "",
        followers: (u.edge_followed_by && u.edge_followed_by.count) || 0,
        verified: !!u.is_verified,
        dp: proxyImage(u.profile_pic_url_hd || u.profile_pic_url),
      };
    } catch (e) { continue; }
  }
  return null;
}

async function doLookup(raw) {
  const seq = ++lookupSeq;
  const platform = platformOf(state.cat);
  const uname = cleanHandle(raw);
  const key = platform + ":" + uname.toLowerCase();

  const hitOne = (base) => fetch(base + "/api/public/profile?platform=" + platform + "&u=" + encodeURIComponent(uname))
    .then(r => r.ok ? r.json() : null)
    .then(j => (j && j.found) ? j : Promise.reject(new Error("no")));

  let data = null;
  try {
    data = await Promise.any(API_BASES.map(hitOne));
  } catch (e) { data = null; }

  if (!data && platform === "instagram") { try { data = await viaProxy(uname); } catch (e) {} }
  if (!data && uname.length > 1) {
    data = { found: true, username: uname, fullName: "",
      dp: "https://unavatar.io/" + platform + "/" + encodeURIComponent(uname) + "?fallback=" + encodeURIComponent(fallbackAvatar(uname)) };
  }
  if (data) LOOKUP_CACHE.set(key, data);
  if (seq !== lookupSeq) return;
  if (data) { state.profile = data; state.profileError = ""; }
  else { state.profile = null; state.profileError = "Profile not found or temporarily unavailable"; }
  state.profileLoading = false;
  renderProfile();
}

function cleanShortcode(raw) {
  const v = (raw || "").trim();
  const m = v.match(/instagram\.com\/(?:[^/]+\/)?(?:p|reel|reels|tv)\/([A-Za-z0-9_-]+)/i);
  if (m) return m[1];
  const bare = v.replace(/^@/, "").split("?")[0].replace(/\/+$/, "");
  return /^[A-Za-z0-9_-]{5,20}$/.test(bare) ? bare : "";
}

async function doPostLookup(raw) {
  const seq = ++lookupSeq;
  const code = cleanShortcode(raw);
  const key = "post:" + code;
  const hitOne = (base) => fetch(base + "/api/public/post?url=" + encodeURIComponent(raw))
    .then(r => r.ok ? r.json() : null)
    .then(j => (j && j.found) ? j : Promise.reject(new Error("no")));
  let data = null;
  for (const base of API_BASES) {
    try {
      const candidate = await hitOne(base);
      const exactCount = state.cat === "ig-views" ? candidate.views : candidate.likes;
      if (typeof exactCount === "number") { data = candidate; break; }
    } catch (e) { }
  }
  if (data) POST_CACHE.set(key, data);
  if (seq !== lookupSeq) return;
  if (data) { state.post = data; state.postError = ""; }
  else { state.post = null; state.postError = state.cat === "ig-views" ? "Exact live views are temporarily unavailable — please retry" : "Post not found — paste a valid public post / reel link"; }
  state.postLoading = false;
  renderProfile();
}

function packQty(title) {
  if (!title) return 0;
  const t = title.toLowerCase();
  let m = t.match(/([\d.]+)\s*(lakh|million|m\b|k\b)/);
  if (m) {
    const n = parseFloat(m[1]);
    if (m[2].indexOf("lakh") === 0) return n * 100000;
    if (m[2].indexOf("m") === 0) return n * 1000000;
    return n * 1000;
  }
  m = t.replace(/,/g, "").match(/(\d+)/);
  return m ? parseInt(m[1], 10) : 0;
}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const k in attrs||{}) {
    const v = attrs[k];
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return el;
}

/* ⚡ DYNAMIC UPIGATEWAY (EKQR) API AUTOMATED PAYMENT PROCESSOR ⚡ */
async function proceed() {
    if (!state.mobile.trim() || !state.target.trim()) {
        alert("Please complete mobile number and target handle details fields.");
        return;
    }
    if (!state.selected) return;
    if (needsPost(state.cat) ? !state.postConfirmed : !state.profileConfirmed) return;

    // Supabase Store
    try {
        await supabaseClient
            .from('orders')
            .insert([
                { 
                  mobile: state.mobile, 
                  service_name: state.selected.title, 
                  category: CATEGORY_META[state.cat].category, 
                  target: state.target, 
                  amount: state.selected.price 
                }
            ]);
    } catch(err) {
        console.error("Supabase Save Error:", err);
    }

    // Dynamic Parameter Parsing for Receipt
    const serviceType = unitOf(state.cat); // Likes, Views, Reposts, etc.
    const qtyCount = packQty(state.selected.title);
    const qtyFormatted = qtyCount.toLocaleString("en-US");
    const currentCount = state.profile ? (state.profile.followers || 0) : (state.post ? (state.post.likes || 0) : 0);
    const orderId = "GSM" + Math.floor(100000 + Math.random() * 900000);
    const cleanTarget = cleanHandle(state.target);

    // ⚠️ Dynamic Auto Redirect Link to Receipt.html
    const redirectUrl = `https://growsocialmedia.in/receipt.html?order_id=${orderId}&type=${encodeURIComponent(serviceType)}&qty=${encodeURIComponent(qtyFormatted)}&insta=${encodeURIComponent(cleanTarget)}&phone=${encodeURIComponent(state.mobile.trim())}&current=${currentCount}&amount=${state.selected.price}`;

    // ⚠️ UPIGateway (EKQR) API Call
    const apiKey = "a0a38d03-e9b8-490c-9df0-7fceb93fd283"; //

    const payload = {
        "key": apiKey,
        "client_txn_id": orderId,
        "amount": state.selected.price.toString(),
        "p_info": "SMM Order - " + serviceType,
        "customer_name": cleanTarget || "Customer",
        "customer_mobile": state.mobile.trim(),
        "customer_email": "support@growsocialmedia.in",
        "redirect_url": redirectUrl,
        "udf1": "growsocialmedia"
    };

    try {
        const res = await fetch("https://api.ekqr.in/api/create_order", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.status && data.data && data.data.payment_url) {
            // Direct Gateway Page Redirect
            window.location.href = data.data.payment_url;
        } else {
            alert("Payment Gateway Error: " + (data.msg || "Unable to initiate transaction. Check API Key."));
        }
    } catch (err) {
        alert("Server Connection Error! Check your network or API settings.");
    }
}

render();
renderProfile();
</script>
